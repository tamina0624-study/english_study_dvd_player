[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-study-dvd-player"
version = "0.1.0"
description = "Windows DVD player for English learning"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "python-vlc>=3.0.21203,<4"]

[project.gui-scripts]
english-dvd-player = "dvd_player.__main__:main"

[tool.setuptools.packages.find]
where = ["02.src"]
exclude = ["tests*"]
